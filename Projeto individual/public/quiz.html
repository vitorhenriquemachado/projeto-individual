<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/corinthians.94597c2d.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">


</head>

<body onload="onloadEsconder(), validarSessao()" class="novoBody">
    <div class="janela">
        <div class="headerLeft">
            <h1>Corinthians</h1>
            <img src="./assets/corinthians.94597c2d.png" alt="">
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>

            </div>


            <div class="quiz">
                <h3>Quiz</h3>

            </div>

            <div class="botaoNav">
                <a href="./dashboard.html">
                    <h3>Dashboard</h3>
                </a>


            </div>
             <div class="botaoNav">
                <a href="./leaderboard.html">       
                <h3>Leaderboard</h3>
                    </a> 
            </div>


            <div class="botaoLogout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>



    </div>
    <div id="pontuacaoEJogo" class="comecarQuiz">
        <button id="botaoInicarQuiz" onclick="iniciarQuiz()" class="botaoIniciar">INICIAR QUIZ</button>

        <div id="pontuacao" class="pontuacaoDurante">
            <div id="pontuacaoDuranteJogo" class="acertos">
                <span>Acertos: <span id="spanCertas">0</span></span>
                <span>Erros: <span id="spanErradas">0</span></span>
            </div>
            <div id="pontuacaoFinalJogo" class="final">
                <span id="pontuacaoFinal">Pontuação Final:
                    <span id="spanPontuacaoFinal">-</span>
                </span>
                <span id="msgFinal" class="finalMsg"></span>
            </div>
        </div>

        <div id="jogo" class="perguntas">

            <div id="infoQuestao" class="info">
                <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                    questões.</span>
            </div>

            <div id="perguntaDaQuestaoAtual">
                <span id="spanQuestaoExibida"></span>
            </div>

            <div id="infoAlternativas">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span class="alternativaLabel">
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span class="alternativaLabel">
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                </span>
            </div>

            <div id="botoes">
                <button onclick="submeter()" id="btnSubmeter">ENVIAR RESPOSTA</button>
               <!--  <button onclick="avancar()" id="btnProx" disabled>PROXIMA PERGUNTA</button> -->
                <button onclick="finalizarJogo()" id="btnConcluir" disabled>FINALIZAR QUIZ</button>
                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>TENTAR NOVAMENTE</button>
            </div>

        </div>
    </div>

</body>

</html>
<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    const listaDeQuestoes = [

        {
            pergunta: "Quem é o maior artilheiro da NEO QUIMICA ARENA?",
            alternativaA: "Angel Romero",
            alternativaB: "Neto",
            alternativaC: "Yuri Alberto",
            alternativaD: "Roger Guedes",
            alternativaCorreta: "alternativaC"
        },

        {
            pergunta: "Quem é o goleiro com mais jogos pelo Corinthians?",
            alternativaA: "Dida",
            alternativaB: "Hugo Souza",
            alternativaC: "Ronaldo",
            alternativaD: "Cássio",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Quantos títulos Brasileiros o Corinthians tem?",
            alternativaA: "8",
            alternativaB: "10",
            alternativaC: "6",
            alternativaD: "7",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Quantos títulos Memphis Depay tem pelo Corinthians?",
            alternativaA: "1",
            alternativaB: "3",
            alternativaC: "4",
            alternativaD: "2",
            alternativaCorreta: "alternativaB"
        },

        {
            pergunta: "Quem é o jogador com mais títulos pelo Corinthians?",
            alternativaA: "Cássio",
            alternativaB: "Dida",
            alternativaC: "Vampeta",
            alternativaD: "Marcelinho Carioca",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Em que ano o Corinthians foi fundado?",
            alternativaA: "1910",
            alternativaB: "1904",
            alternativaC: "1908",
            alternativaD: "1901",
            alternativaCorreta: "alternativaA"
        },

        {
            pergunta: "Quem é o jogador com a maior média de gols pelo Corinthians?",
            alternativaA: "Luizão",
            alternativaB: "Milani",
            alternativaC: "Baltazar",
            alternativaD: "Teleco",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Quantos gols de falta tem Marcelinho Carioca pelo Corinthians?",
            alternativaA: "44",
            alternativaB: "53",
            alternativaC: "48",
            alternativaD: "50",
            alternativaCorreta: "alternativaB"
        },

        {
            pergunta: "Quem é o jogador com mais jogos pelo Corinthians?",
            alternativaA: "Wladimir",
            alternativaB: "Cássio",
            alternativaC: "Luizinho",
            alternativaD: "Ronaldo",
            alternativaCorreta: "alternativaA"
        },

        {
            pergunta: "Maior artilheiro da história do Corinthians?",
            alternativaA: "Cláudio",
            alternativaB: "Baltazar",
            alternativaC: "Neco",
            alternativaD: "Teleco",
            alternativaCorreta: "alternativaA"
        }


    ]

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('botaoInicarQuiz').style.display = "none"


        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)
        btnConcluir.style.display = "none"
        btnTentarNovamente.style.display = "none"

        
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            /* btnProx.disabled = false */

            habilitarAlternativas(false)

           
        }
       /*  btnProx.disabled = true */
        btnSubmeter.disabled = false
        btnConcluir.disabled = false
        btnTentarNovamente.disabled = false
         checarResposta()
        desmarcarRadioButtons()

        if (numeroDaQuestaoAtual >= quantidadeDeQuestoes) {
            // esconde as perguntas e informações sobre as questoes quando o numero de perguntas respondidas = 1
            document.getElementById("perguntaDaQuestaoAtual").style.display = "none"
            document.getElementById("opcoes").style.display = "none"
            document.getElementById("infoAlternativas").style.display = "none"
            document.getElementById("infoQuestao").style.display = "none"
            

            // esconde os botoes inuteis no final do quiz
            btnSubmeter.style.display = "none"
            /* btnProx.style.display = "none" */

            // mostra os botoes uteis no final do quiz
            btnConcluir.style.display = "block"
            btnTentarNovamente.style.display = "block"


        } else {

            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        }
        limparCoresBackgroundOpcoes()
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida

    }
/* 
    function avancar() {
        
    } */

    function tentarNovamente() {
        // atualiza a página

        let idUsuario = sessionStorage.ID_USUARIO;

             
                
        document.getElementById("jogo").style.display = "none"
        document.getElementById("perguntaDaQuestaoAtual").style.display = "none"
        document.getElementById("opcoes").style.display = "none"
        document.getElementById("infoAlternativas").style.display = "none"
        document.getElementById("infoQuestao").style.display = "none"
        

        btnSubmeter.style.display = "none"


         fetch("/quiz/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                pontuacao: pontuacaoFinal,
                fkUsuario: idUsuario,
                acertos: certas,
                erros: erradas


            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {


                    console.log("Feito com sucesso")

                    setTimeout(() => {
                        window.location.reload()
                    }, 0);



                } else {
                    throw "Erro ao inserir o quiz!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);

            });

        return false;


        
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
        const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual

        const options = document.getElementsByName("option"); // recupera alternativas no html

        let alternativaCorreta = null // variável para armazenar a alternativa correta

        options.forEach((option) => {
            if (option.value === respostaQuestaoAtual) {
                alternativaCorreta = option.labels[0].id
                console.log("alternativaCorreta está no componente: " + alternativaCorreta)

            }
        })

        // verifica se resposta assinalada é correta
        options.forEach((option) => {
            if (option.checked === true && option.value === respostaQuestaoAtual) {
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                pontuacaoFinal++
                certas++
                document.getElementById("spanCertas").innerHTML = certas
                numeroDaQuestaoAtual++
            } else if (option.checked && option.value !== respostaQuestaoAtual) {
                const wrongLabelId = option.labels[0].id

                document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                tentativaIncorreta++
                erradas++
                document.getElementById("spanErradas").innerHTML = erradas
                numeroDaQuestaoAtual++
            }
        })
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {
        let idUsuario = sessionStorage.ID_USUARIO;

                      

        document.getElementById("jogo").style.display = "none"
        document.getElementById("perguntaDaQuestaoAtual").style.display = "none"
        document.getElementById("opcoes").style.display = "none"
        document.getElementById("infoAlternativas").style.display = "none"
        document.getElementById("infoQuestao").style.display = "none"


        // esconde os botoes no resultado final se o usuario nao quiser tentar novamente
        btnSubmeter.style.display = "none"
     /*    btnProx.style.display = "none" */
        btnConcluir.style.display = "none"
        btnTentarNovamente.style.display = "none"


        fetch("/quiz/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                pontuacao: pontuacaoFinal,
                fkUsuario: idUsuario,
                acertos: certas,
                erros: erradas

            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {


                    console.log("Feito com sucesso")

                    setTimeout(() => {
                        window.location = "dashboard.html";
                    }, 0);



                } else {
                    throw "Erro ao inserir quiz!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);

            });

        return false;


    }


</script>
